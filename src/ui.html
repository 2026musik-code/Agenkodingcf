<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Agent Coding</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/styles/atom-one-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/4.3.0/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/highlight.min.js"></script>
    <style>
        /* Custom scrollbar */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #1f2937; }
        ::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #6b7280; }
        .glass {
            background: rgba(31, 41, 55, 0.7);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#3b82f6',
                        secondary: '#10b981',
                        dark: '#0f172a',
                        darker: '#020617',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-darker text-gray-200 font-sans h-screen flex overflow-hidden">

    <!-- Sidebar -->
    <aside class="w-80 bg-dark border-r border-gray-800 flex flex-col glass z-10">
        <div class="p-4 border-b border-gray-800 flex justify-between items-center">
            <h1 class="text-xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-blue-400 to-emerald-400">
                <i class="fa-solid fa-robot mr-2"></i>AI Agent
            </h1>
            <button id="settingsBtn" class="text-gray-400 hover:text-white transition">
                <i class="fa-solid fa-gear"></i>
            </button>
        </div>

        <!-- Repo Loader -->
        <div class="p-4 space-y-2">
            <label class="text-xs text-gray-500 uppercase font-semibold">Repository</label>
            <div class="flex space-x-2">
                <input type="text" id="repoInput" placeholder="owner/repo" class="w-full bg-gray-900 border border-gray-700 rounded px-3 py-1.5 text-sm focus:outline-none focus:border-primary transition">
                <button id="loadRepoBtn" class="bg-primary hover:bg-blue-600 text-white px-3 py-1.5 rounded text-sm transition">
                    <i class="fa-solid fa-download"></i>
                </button>
            </div>
        </div>

        <!-- File Tree -->
        <div class="flex-1 overflow-y-auto p-2" id="fileTree">
            <div class="text-center text-gray-500 text-sm mt-10">
                Load a repository to view files.
            </div>
        </div>

        <!-- Context Summary -->
        <div class="p-3 border-t border-gray-800 bg-gray-900/50 text-xs text-gray-400 flex justify-between">
            <span>Selected Files: <span id="selectedCount" class="text-white font-bold">0</span></span>
            <button id="clearContextBtn" class="hover:text-red-400 transition">Clear</button>
        </div>
    </aside>

    <!-- Main Chat Area -->
    <main class="flex-1 flex flex-col relative">
        <!-- Chat History -->
        <div id="chatContainer" class="flex-1 overflow-y-auto p-6 space-y-6 scroll-smooth pb-32">
            <!-- Welcome Message -->
            <div class="flex items-start space-x-4">
                <div class="w-10 h-10 rounded-full bg-gradient-to-br from-blue-500 to-purple-600 flex items-center justify-center shadow-lg">
                    <i class="fa-solid fa-robot text-white"></i>
                </div>
                <div class="glass rounded-2xl rounded-tl-none p-4 max-w-3xl shadow-xl">
                    <p>Hello! I am your AI Coding Agent. Load a GitHub repository to get started, or ask me anything.</p>
                </div>
            </div>
        </div>

        <!-- Input Area -->
        <div class="absolute bottom-0 w-full p-6 bg-gradient-to-t from-darker to-transparent">
            <div class="max-w-4xl mx-auto relative glass rounded-xl shadow-2xl border border-gray-700/50">
                <textarea id="promptInput" rows="3" placeholder="Describe your coding task or ask a question..." class="w-full bg-transparent border-none text-white p-4 focus:ring-0 resize-none placeholder-gray-500"></textarea>
                <div class="flex justify-between items-center px-4 pb-3 border-t border-gray-700/30 pt-2">
                    <div class="text-xs text-gray-500">
                        <i class="fa-brands fa-markdown mr-1"></i> Markdown supported
                    </div>
                    <button id="sendBtn" class="bg-gradient-to-r from-blue-600 to-emerald-600 hover:from-blue-500 hover:to-emerald-500 text-white px-6 py-2 rounded-lg font-semibold shadow-lg transition transform hover:scale-105 flex items-center">
                        <span>Send</span> <i class="fa-solid fa-paper-plane ml-2"></i>
                    </button>
                </div>
            </div>
        </div>
    </main>

    <!-- Settings Modal -->
    <div id="settingsModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex items-center justify-center">
        <div class="bg-gray-900 border border-gray-700 rounded-xl w-full max-w-md p-6 shadow-2xl transform transition-all scale-95 opacity-0" id="settingsContent">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-xl font-bold text-white">Settings</h2>
                <button id="closeSettingsBtn" class="text-gray-400 hover:text-white transition">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>

            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-400 mb-1">Ferdev AI API Key</label>
                    <input type="password" id="apiKeyInput" class="w-full bg-gray-800 border border-gray-700 rounded px-3 py-2 text-white focus:border-primary focus:outline-none transition">
                    <p class="text-xs text-gray-600 mt-1">Required for AI functionality.</p>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-400 mb-1">GitHub Token (Optional)</label>
                    <input type="password" id="githubTokenInput" class="w-full bg-gray-800 border border-gray-700 rounded px-3 py-2 text-white focus:border-primary focus:outline-none transition">
                    <p class="text-xs text-gray-600 mt-1">Required for private repos or higher rate limits.</p>
                </div>
            </div>

            <div class="mt-8 flex justify-end">
                <button id="saveSettingsBtn" class="bg-primary hover:bg-blue-600 text-white px-4 py-2 rounded transition shadow-lg">
                    Save Configuration
                </button>
            </div>
        </div>
    </div>

    <script src="/ui.js"></script>
</body>
</html>
